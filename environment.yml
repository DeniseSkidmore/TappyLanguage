# One conda environment for all TappyLanguage Python: hooks, data scripts, forced alignment.
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Scripts reach it through TAPPY_PYTHON (machine-specific, set in .claude/settings.local.json).
#
# Every package is pinned, including dependencies (resolved 2026-11-19 with
# `conda create --dry-run` and `pip install --dry-run --report` against Python 3.13.9, win-64).
# Conda pins carry build strings, so this file is win-64 only.
# To change a top-level version: edit it, re-run both dry runs, replace the pinned lists.
#
# Top-level choices (the rest are their dependencies):
#   python 3.13.9   whisperx 3.8.6 needs >=3.10,<3.14
#   ffmpeg 9.0.2    audio decoding for whisperx / torchaudio
#   whisperx 3.8.6  forced alignment only (whisperx.align, Greek wav2vec2 model); no Whisper ASR model
#   torch 2.8.0, torchaudio 2.8.0, torchvision 0.23.0   required by whisperx 3.8.6 (~=); CPU builds from PyPI
